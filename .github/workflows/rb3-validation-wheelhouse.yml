name: rb3-validation-wheelhouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strap-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned public STRAP source
        run: |
          set -euxo pipefail
          git clone https://github.com/WEIRDLabUW/robomimic_strap.git public-strap
          cd public-strap
          git checkout 3386adb5b664e9bedf88e7d26ced986439e67193
          git rev-parse HEAD > PINNED_COMMIT.txt
          rm -rf .git
          cd ..
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('public-strap')
          files = {}
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files[rel] = {
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          (root / 'SOURCE_MANIFEST.json').write_text(
              json.dumps(files, indent=2, sort_keys=True) + '\n'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-robomimic-strap-3386adb
          path: public-strap
          retention-days: 2
          if-no-files-found: error
