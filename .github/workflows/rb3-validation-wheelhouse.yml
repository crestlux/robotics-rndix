name: rb3-validation-wheelhouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Download validation wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse \
            mujoco==3.3.7 \
            robosuite==1.4.0 \
            robomimic==0.3.0 \
            absl-py \
            etils \
            glfw \
            PyOpenGL \
            termcolor \
            tqdm \
            psutil \
            tensorboard \
            tensorboardX \
            tianshou \
            imageio \
            imageio-ffmpeg \
            matplotlib \
            gym==0.25.2 \
            cloudpickle \
            future \
            easydict \
            einops \
            thop \
            diffusers \
            hydra-core \
            wandb
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          out = {}
          for path in sorted(Path('wheelhouse').glob('*')):
              out[path.name] = {
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          Path('wheelhouse/manifest.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rb3-validation-wheelhouse-py313
          path: wheelhouse
          retention-days: 2
          if-no-files-found: error
